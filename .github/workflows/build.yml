name: Build DLL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockWaypoints
          path: build/Release/BedrockWaypoints.dll

      # Keeps one "latest" release with the newest DLL, so there is a simple download link.
      - name: Publish latest build
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Release/BedrockWaypoints.dll --prerelease \
            --title "Latest build" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
